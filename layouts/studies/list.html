<!DOCTYPE html>
<html>
<head>
    <title>{{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main>
        <h1>{{ .Title }}</h1>
        {{ .Content }}
    </main>

    {{/* iterate through subsections */}}
    {{ range .Sections }}
        <section class="study-section">
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <ul>
                {{/* iterate through blogposts of each subsection */}}
                {{ range .RegularPages }}
                    <li>
                        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
                        <time>{{ .Date.Format "02.01.2006" }}</time>
                    </li>
                {{ end }}
            </ul>
        </section>
    {{ end }}

    <hr>
    <a href="/">← На главную</a>
</body>
</html>
