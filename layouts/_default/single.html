{{ define "main" }}
    <!DOCTYPE html>
    <html>
    <head>
        <title>{{ .Title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="/css/style.css">
    </head>
    <body>
        <a href="{{ .Site.Home.RelPermalink }}">← {{ T "take-me-home" }}</a>
        <article class="post-content">
            <h1>{{ .Title }}</h1>
            <p><i>{{ .Date.Format "02.01.2006" }}</i></p>
            <hr>
            {{ .Content }}
        </article>
        <section class="feedback-section">
            <h3>Задать вопрос или оставить отзыв</h3>
            
            <form action="https://api.web3forms.com/submit" method="POST" class="feedback-form">
                <input type="hidden" name="access_key" value="574e2f4c-97de-4b46-933b-535e4cd2e121">
                <input type="hidden" name="subject" value="Вопрос по статье: {{ .Title }}">
                <input type="hidden" name="from_name" value="dvprokofiev.ru">
                <input type="hidden" name="article_url" value="{{ .Permalink }}">
                <input type="checkbox" name="botcheck" style="display: none;">

                <div class="form-row">
                    <input type="text" name="name" placeholder="Как к вам обращаться?" required>
                    <input type="email" name="email" placeholder="Ваш email для ответа">
                </div>
                
                <textarea name="message" rows="4" placeholder="Что бы вы хотели сказать?" required></textarea>
                
                <div class="form-footer">
                    <button type="submit">Отправить вопрос</button>
                    <span class="feedback-alt">
                        или напрямую на <a href="mailto:d@dvprokofiev.ru?subject=Re: {{ .Title | default (.Date.Format "02.01.2006") }}">d@dvprokofiev.ru</a>
                    </span>
                </div>
            </form>
        </section>
    </body>
    </html>
{{ end }}
